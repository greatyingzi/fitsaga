name: pipeline

on:
  push:
    branches: [master, test]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fitsaga-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect (source platforms, from collector/)
        run: |
          cd collector
          python3 duitang.py --pages 3 --limit 24
          python3 musinsa.py
          python3 civitai.py
          python3 lofter.py || true
          python3 atlas_backfill.py
          python3 topic_miner.py || true

      - name: Radar & draft pool (root scripts)
        run: |
          python3 hot_radar.py || true
          python3 topic_draft_gen.py || true

      - name: Generate site (all generators, sitemap LAST)
        run: |
          python3 gen_site.py
          python3 gen_nikki.py
          NIKKI_PAGE=2 python3 gen_nikki.py
          NIKKI_PAGE=3 python3 gen_nikki.py
          python3 gen_nikki_detail.py
          python3 gen_nikki_en.py
          python3 gen_collections.py
          python3 gen_collections_b2.py
          python3 gen_collections_b3.py
          python3 gen_ai.py
          python3 gen_zara.py
          python3 gen_guide.py
          python3 gen_topics.py
          python3 gen_downloads.py
          python3 gen_downloads_page.py
          python3 gen_search_index.py
          python3 gen_sitemap.py

      - name: Deploy to PROD (fitsaga.pages.dev, master only)
        if: github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=fitsaga --branch=main --commit-dirty=true

      - name: Deploy to STAGING (fitsaga-dev.pages.dev, test only)
        if: github.ref == 'refs/heads/test'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=fitsaga-dev --branch=test --commit-dirty=true

      - name: Commit updated DB back
        run: |
          git config user.name "fitsaga-bot"
          git config user.email "android_li@foxmail.com"
          git pull --rebase -q origin master || true
          git add data/
          git diff --cached --quiet && echo "no db changes" || git commit -m "chore: daily db update [skip ci]"
          git push
